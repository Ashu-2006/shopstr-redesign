<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Shopstr — Working Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/bold/style.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css" />
<style>
:root{
  --ink:#121212; --paper:#f4f3ef; --pp:#fff; --p2:#ece9e1;
  --muted:#5c5b55; --subtle:#8a897f; --on-dark:#f4f3ef;
  --purple:#5a51e5; --purple-press:#4a42c9; --purple-soft:#e7e5fb;
  --orange:#ff8336; --yellow:#ffc313; --red:#ff4040; --green:#25c26e; --blue:#00aeff; --pink:#ff3dac;
  --ys:#fff1cc; --gs:#d3f5e3; --ps:#ffdcef; --bs:#cdeeff;
  --fd:"Archivo Black",system-ui,sans-serif; --fb:"Space Grotesk",system-ui,sans-serif; --fm:"Space Mono",monospace;
  --r-md:.875rem; --r-lg:1.25rem; --r-xl:1.75rem; --r-2xl:2.25rem; --r-pill:999px;
  --st:2px; --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--p2);color:var(--ink);font-family:var(--fb);-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;min-height:100vh}
img{display:block}
.display{font-family:var(--fd);text-transform:uppercase;letter-spacing:-.02em;line-height:.92}
.val{font-family:var(--fm);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- device frame (phone on desktop, full-bleed on small screens) ---- */
.device{width:420px;height:880px;max-height:96vh;border-radius:46px;border:3px solid var(--ink);background:var(--pp);overflow:hidden;position:relative;display:flex;flex-direction:column}
@media(max-width:480px){body{align-items:stretch}.device{width:100%;height:100dvh;max-height:none;border:none;border-radius:0}}

.statusbar{height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-family:var(--fm);font-size:.72rem;font-weight:700;flex:0 0 auto;z-index:30;background:transparent}
.statusbar .dots{display:flex;gap:5px}.statusbar .dots i{width:6px;height:6px;border-radius:50%;background:currentColor;display:block}

/* ---- screen system ---- */
.stage{flex:1;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;background:var(--paper);opacity:0;visibility:hidden;transform:translateX(12px);transition:opacity .26s var(--ease),transform .26s var(--ease),visibility .26s}
.screen.active{opacity:1;visibility:visible;transform:none;z-index:2}
.screen.leaving{opacity:0;transform:translateX(-10px);z-index:1}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{width:0}
.pad{padding:16px}.pb{padding-bottom:108px}

/* ---- atoms ---- */
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:.8rem;padding:8px 14px;border-radius:var(--r-pill);border:var(--st) solid var(--ink);background:var(--pp);white-space:nowrap;cursor:pointer}
.pill.sm{font-size:.7rem;padding:5px 11px}
.pill.ink{background:var(--ink);color:var(--on-dark)}
.pill.y{background:var(--yellow)}.pill.g{background:var(--green)}.pill.p{background:var(--pink)}.pill.b{background:var(--blue)}.pill.o{background:var(--orange)}.pill.pu{background:var(--purple);color:#fff;border-color:var(--purple)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;font-weight:700;font-size:1rem;padding:16px 24px;border-radius:var(--r-pill);border:var(--st) solid var(--ink);cursor:pointer;font-family:var(--fb);background:var(--ink);color:var(--on-dark)}
.btn.pu{background:var(--purple);color:#fff;border-color:var(--purple)}
.btn.w{background:var(--pp);color:var(--ink)}
.btn.full{width:100%}
.press{transition:scale .13s var(--ease)}.press:active{scale:.95}
.ic{width:42px;height:42px;border-radius:50%;border:var(--st) solid var(--ink);background:var(--pp);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
.muted{color:var(--muted)}.subtle{color:var(--subtle)}
.imgwrap{position:relative;overflow:hidden}.imgwrap img{width:100%;height:100%;object-fit:cover}
.kick{font-family:var(--fm);font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* ---- top bar (progressive disclosure search) ---- */
.bar{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:var(--st) solid var(--ink)}
.bar .row{display:flex;align-items:center;gap:10px;padding:12px 16px}
.brand{font-family:var(--fd);text-transform:uppercase;font-size:1.1rem;letter-spacing:-.02em;display:flex;align-items:center;margin-right:auto;cursor:pointer}
.brand img{height:.78em;vertical-align:-.12em;margin:0 .02em}
.cart{position:relative;background:var(--yellow)}
.cart b{position:absolute;top:-6px;right:-6px;background:var(--ink);color:#fff;font-family:var(--fm);font-size:.58rem;min-width:18px;height:18px;padding:0 4px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.disc{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s var(--ease)}
.disc.open{grid-template-rows:1fr}
.disc>div{overflow:hidden}
.search{display:flex;align-items:center;gap:8px;margin:0 16px 12px;padding:11px 15px;border:var(--st) solid var(--ink);border-radius:var(--r-pill);background:var(--pp)}
.search input{border:none;outline:none;font-family:var(--fb);font-size:.9rem;width:100%;background:none}
.filters{display:flex;gap:8px;overflow-x:auto;padding:0 16px 12px}.filters::-webkit-scrollbar{height:0}

/* ---- bottom nav ---- */
.nav{position:absolute;left:0;right:0;bottom:0;z-index:25;padding:12px 16px calc(12px + env(safe-area-inset-bottom));}
.navbar{display:flex;align-items:center;justify-content:space-between;gap:4px;background:var(--ink);border-radius:var(--r-pill);padding:7px}
.navbtn{flex:0 0 auto;height:48px;border-radius:var(--r-pill);display:flex;align-items:center;gap:8px;padding:0 12px;border:none;background:transparent;color:#fff;cursor:pointer;transition:background .2s var(--ease),color .2s var(--ease)}
.navbtn.on{background:var(--yellow);color:var(--ink)}
.navbtn .lbl{font-family:var(--fd);text-transform:uppercase;font-size:.82rem;display:none}
.navbtn.on .lbl{display:inline}

/* ---- editorial marketplace ---- */
.hero{position:relative;border-radius:var(--r-xl);border:var(--st) solid var(--ink);overflow:hidden;height:300px;color:#fff;cursor:pointer}
.hero .imgwrap{position:absolute;inset:0}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 38%,rgba(0,0,0,.8))}
.hero .num{position:absolute;top:14px;left:16px;z-index:2;font-family:var(--fd);font-size:2.4rem;mix-blend-mode:difference}
.hero .chips{position:absolute;top:16px;right:14px;z-index:2;display:flex;gap:6px}
.hero .cap{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:18px}
.hero .cap h3{font-family:var(--fd);text-transform:uppercase;font-size:1.7rem;line-height:.92;letter-spacing:-.02em}
.hero .cap .r{display:flex;align-items:baseline;justify-content:space-between;margin-top:8px}
.hero .cap .pr{font-family:var(--fm);font-weight:700;font-size:1.15rem}
.hero .cap .loc{font-family:var(--fm);font-size:.74rem;opacity:.85}
.hero .stk{position:absolute;z-index:2;width:52px;height:52px;top:54px;right:16px}

.sectitle{display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 12px}
.sectitle .h{font-family:var(--fd);text-transform:uppercase;font-size:1.2rem}
.sectitle .c{font-family:var(--fm);font-size:.72rem;color:var(--subtle)}

/* pair grid (the improved cards) */
.pairgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pcard{border-radius:var(--r-lg);border:var(--st) solid var(--ink);overflow:hidden;background:var(--pp);cursor:pointer;display:flex;flex-direction:column}
.pcard .imgwrap{height:140px}
.pcard .b{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.pcard .t{font-weight:700;font-size:.9rem;line-height:1.12}
.pcard .r{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:6px}
.pcard .pr{font-family:var(--fm);font-weight:700;font-size:.88rem}
.pcard .loc{font-family:var(--fm);font-size:.62rem;color:var(--subtle)}
.pcard .tag{position:absolute;top:8px;left:8px;z-index:2}

/* horizontal scroller row */
.hrow{display:flex;gap:12px;overflow-x:auto;padding:2px 0 6px;margin:0 -16px;padding-left:16px;padding-right:16px}
.hrow::-webkit-scrollbar{height:0}
.hmini{flex:0 0 150px;border-radius:var(--r-lg);border:var(--st) solid var(--ink);overflow:hidden;background:var(--pp);cursor:pointer}
.hmini .imgwrap{height:120px}
.hmini .b{padding:10px}
.hmini .t{font-weight:700;font-size:.82rem;line-height:1.1}
.hmini .pr{font-family:var(--fm);font-weight:700;font-size:.8rem;margin-top:6px}

/* category band */
.catband{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.catt{border-radius:var(--r-lg);border:var(--st) solid var(--ink);padding:16px;min-height:84px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;cursor:pointer}
.catt .l{font-family:var(--fd);text-transform:uppercase;font-size:1.05rem;line-height:.95}
.catt.g{background:var(--green)}.catt.y{background:var(--yellow)}.catt.b{background:var(--blue)}.catt.p{background:var(--pink)}
.catt .stk{position:absolute;right:-6px;bottom:-6px;width:48px;height:48px}

/* ---- listing detail ---- */
.lhead{display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
.gallery{position:relative;margin:0 16px;border-radius:var(--r-2xl);border:var(--st) solid var(--ink);overflow:hidden;aspect-ratio:1;background:var(--p2)}
.gallery .stk{position:absolute;top:12px;right:12px;width:50px;height:50px;z-index:2}
.gallery .tag{position:absolute;top:12px;left:12px;z-index:2}
.thumbs{display:flex;gap:10px;margin:12px 16px 0}
.thumb{width:58px;height:58px;border-radius:var(--r-md);border:var(--st) solid var(--ink);overflow:hidden;cursor:pointer;opacity:.6}
.thumb.on{opacity:1;border-color:var(--purple)}
.linfo{padding:18px 16px;display:flex;flex-direction:column;gap:14px}
.linfo h1{font-family:var(--fd);text-transform:uppercase;font-size:1.9rem;line-height:.94;letter-spacing:-.02em}
.priceblock{display:flex;align-items:flex-end;gap:8px}
.priceblock .n{font-family:var(--fm);font-weight:700;font-size:2.4rem;line-height:.9}
.priceblock .u{font-family:var(--fm);font-size:.9rem;color:var(--muted);padding-bottom:3px}
.metarow{display:flex;flex-wrap:wrap;gap:8px}
.desc{color:var(--muted);font-size:.95rem;line-height:1.5}
.detail{display:grid;grid-template-columns:1fr 1fr;gap:var(--st);overflow:hidden;border-radius:var(--r-lg);border:var(--st) solid var(--ink);background:var(--ink)}
.detail>div{background:var(--pp);padding:12px}
.detail dt{font-family:var(--fm);font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;color:var(--subtle)}
.detail dd{font-weight:600;margin-top:3px;font-size:.9rem}
.seller{display:flex;align-items:center;gap:11px;background:var(--ink);color:var(--on-dark);border-radius:var(--r-lg);padding:12px;cursor:pointer}
.seller .av{width:42px;height:42px;border-radius:11px;background:var(--yellow);color:var(--ink);font-family:var(--fd);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.seller .h{font-weight:700;display:flex;align-items:center;gap:5px}
.seller .m{font-family:var(--fm);font-size:.7rem;color:#bdbcb4}
.seller .v{margin-left:auto;background:var(--pp);color:var(--ink);border:none;border-radius:var(--r-pill);padding:8px 14px;font-weight:700;font-family:var(--fb);cursor:pointer}
.review{border-radius:var(--r-lg);border:var(--st) solid var(--ink);background:var(--pp);padding:13px}
.review .r{display:flex;justify-content:space-between}
.review .s{font-family:var(--fm);font-weight:700}
.review .t{font-family:var(--fm);font-size:.68rem;color:var(--subtle)}

/* sticky buy bar (within listing) */
.buybar{position:absolute;left:0;right:0;bottom:0;z-index:24;padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.buybar .inner{display:flex;align-items:center;gap:10px;background:var(--ink);border-radius:var(--r-2xl);padding:11px}
.buybar .pr{display:flex;flex-direction:column;padding:0 6px 0 8px;color:#fff}
.buybar .pr .k{font-family:var(--fm);font-size:.56rem;text-transform:uppercase;color:#bdbcb4}
.buybar .pr .n{font-family:var(--fm);font-weight:700;font-size:1.05rem;line-height:1}
.buybar .buy{flex:1;background:var(--purple);color:#fff;border:none;border-radius:var(--r-pill);padding:15px;font-weight:700;font-family:var(--fb);font-size:1rem;cursor:pointer}
.buybar .cc{width:50px;height:50px;border-radius:50%;border:none;cursor:pointer;padding:0;background:none;flex:0 0 auto}
.buybar .cc img{width:50px;height:50px}
.walletnote{position:absolute;left:16px;right:16px;bottom:84px;z-index:23;background:var(--purple-soft);border:var(--st) solid var(--purple);color:var(--purple-press);border-radius:var(--r-pill);padding:8px 14px;font-family:var(--fm);font-size:.72rem;font-weight:700;display:flex;align-items:center;gap:7px;justify-content:center}

/* ---- generic sheet header ---- */
.shead{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:var(--st) solid var(--ink);background:var(--paper);position:sticky;top:0;z-index:10}
.shead .t{font-family:var(--fd);text-transform:uppercase;font-size:1.15rem}
.shead .sp{flex:1}

/* ---- cart ---- */
.citem{display:flex;align-items:center;gap:12px;border-radius:var(--r-lg);border:var(--st) solid var(--ink);background:var(--pp);padding:11px;margin-bottom:10px}
.citem .th{width:54px;height:54px;border-radius:var(--r-md);border:var(--st) solid var(--ink);object-fit:cover;flex:0 0 auto}
.citem .t{font-weight:700;font-size:.9rem;line-height:1.1}
.citem .pr{font-family:var(--fm);font-size:.78rem;color:var(--muted);margin-top:3px}
.qty{display:flex;align-items:center;gap:8px;margin-left:auto}
.qty button{width:30px;height:30px;border-radius:9px;border:var(--st) solid var(--ink);background:var(--pp);font-weight:700;cursor:pointer;font-size:1rem;line-height:1}
.qty .n{font-family:var(--fm);font-weight:700;min-width:18px;text-align:center}
.summary{border-radius:var(--r-lg);border:var(--st) solid var(--ink);background:var(--purple);color:#fff;padding:16px;margin-top:6px}
.summary .ln{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;font-family:var(--fm);font-size:.85rem}
.summary .ln.big{font-size:1.05rem;font-weight:700;margin-bottom:14px}
.summary .ln.big .n{font-size:1.5rem}

/* ---- checkout / payment ---- */
.payseg{display:flex;gap:0;border:var(--st) solid var(--ink);border-radius:var(--r-pill);overflow:hidden;background:var(--pp)}
.payseg button{flex:1;border:none;background:none;padding:12px;font-weight:700;font-family:var(--fb);cursor:pointer}
.payseg button.on{background:var(--ink);color:#fff}
.qr{width:200px;height:200px;border-radius:var(--r-lg);border:var(--st) solid var(--ink);margin:6px auto;background:
  conic-gradient(from 0deg,#121212 0 25%,#fff 0 50%,#121212 0 75%,#fff 0)
  ,repeating-conic-gradient(#121212 0 12.5%,#fff 0 25%);background-size:24px 24px;display:flex;align-items:center;justify-content:center}
.qr .mid{width:50px;height:50px;background:#fff;border:var(--st) solid var(--ink);border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:var(--fd);color:var(--purple)}
.countdown{font-family:var(--fm);font-weight:700;text-align:center;margin-top:10px}
.tokenbox{width:100%;min-height:90px;border-radius:var(--r-lg);border:var(--st) dashed var(--ink);background:var(--pp);padding:13px;font-family:var(--fm);font-size:.8rem;color:var(--muted);resize:none}

/* ---- paid success ---- */
.paid{background:var(--green);height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:16px;position:relative;overflow:hidden}
.paid .stk{position:absolute;width:56px;height:56px}
.paid .check{width:118px;height:118px;border-radius:50%;background:var(--ink);display:flex;align-items:center;justify-content:center;z-index:2}
.paid .check svg path{stroke-dasharray:40;stroke-dashoffset:40}
.paid.go .check svg path{animation:draw .55s var(--ease) .15s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.paid h2{font-family:var(--fd);text-transform:uppercase;font-size:2rem;line-height:.95;z-index:2}
.paid .amt{font-family:var(--fm);font-weight:700;background:var(--pp);border:var(--st) solid var(--ink);border-radius:var(--r-pill);padding:9px 18px;z-index:2}
.paid .receipt{background:var(--pp);border:var(--st) solid var(--ink);border-radius:var(--r-lg);padding:15px;width:100%;z-index:2;font-family:var(--fm);font-size:.82rem;display:flex;flex-direction:column;gap:9px}
.paid .receipt .ln{display:flex;justify-content:space-between}
.paid .loop{display:flex;gap:10px;width:100%;z-index:2;margin-top:4px}

/* ---- messages ---- */
.thread-item{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:var(--st) solid var(--ink);cursor:pointer}
.thread-item .av{width:46px;height:46px;border-radius:13px;object-fit:cover;flex:0 0 auto;border:var(--st) solid var(--ink)}
.thread-item .t{font-weight:700}
.thread-item .last{font-size:.84rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
.thread-item .meta{margin-left:auto;text-align:right;flex:0 0 auto}
.thread-item .time{font-family:var(--fm);font-size:.64rem;color:var(--subtle)}
.thread-item .unread{display:inline-block;margin-top:5px;background:var(--purple);color:#fff;font-family:var(--fm);font-size:.6rem;font-weight:700;min-width:18px;height:18px;border-radius:9px;padding:0 5px;line-height:18px}
.msgs{display:flex;flex-direction:column;gap:10px;padding:16px}
.msg{max-width:78%;padding:11px 14px;border-radius:var(--r-lg);font-size:.9rem;line-height:1.35}
.msg.them{background:var(--pp);border:var(--st) solid var(--ink);align-self:flex-start;border-bottom-left-radius:5px}
.msg.me{background:var(--purple);color:#fff;align-self:flex-end;border-bottom-right-radius:5px}
.msg .ctx{display:flex;gap:9px;align-items:center;background:rgba(0,0,0,.06);border-radius:10px;padding:7px;margin-bottom:7px}
.msg.me .ctx{background:rgba(255,255,255,.15)}
.msg .ctx img{width:34px;height:34px;border-radius:7px;object-fit:cover}
.composer{display:flex;gap:9px;padding:12px 16px;border-top:var(--st) solid var(--ink);background:var(--paper)}
.composer input{flex:1;border:var(--st) solid var(--ink);border-radius:var(--r-pill);padding:11px 16px;font-family:var(--fb);outline:none}

/* ---- wallet ---- */
.balance{background:var(--ink);color:#fff;border-radius:var(--r-2xl);padding:22px;position:relative;overflow:hidden}
.balance .k{font-family:var(--fm);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:#bdbcb4}
.balance .big{font-family:var(--fm);font-weight:700;font-size:3rem;line-height:.95;margin-top:6px}
.balance .big span{font-size:1rem;color:#bdbcb4}
.balance .stk{position:absolute;right:14px;top:14px;width:54px;height:54px}
.wbtns{display:flex;gap:10px;margin-top:14px}
.tx{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:var(--st) solid var(--ink)}
.tx .d{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--fd);flex:0 0 auto}
.tx .d.out{background:var(--pink)}.tx .d.in{background:var(--green)}
.tx .t{font-weight:700;font-size:.9rem}
.tx .s{font-family:var(--fm);font-size:.66rem;color:var(--subtle)}
.tx .amt{margin-left:auto;font-family:var(--fm);font-weight:700}

/* ---- profile ---- */
.phead{background:var(--yellow);padding:24px 16px 18px;border-bottom:var(--st) solid var(--ink);position:relative;overflow:hidden}
.phead .av{width:78px;height:78px;border-radius:20px;border:var(--st) solid var(--ink);object-fit:cover}
.phead h2{font-family:var(--fd);text-transform:uppercase;font-size:1.9rem;margin-top:12px;display:flex;align-items:center;gap:8px}
.phead .npub{font-family:var(--fm);font-size:.7rem;color:#6b5e16;margin-top:4px}
.phead .stk{position:absolute;right:14px;top:14px;width:60px;height:60px}
.pstats{display:flex;gap:10px;margin-top:14px}
.pstat{flex:1;background:var(--pp);border:var(--st) solid var(--ink);border-radius:var(--r-lg);padding:11px;text-align:center}
.pstat .n{font-family:var(--fm);font-weight:700;font-size:1.2rem}
.pstat .k{font-family:var(--fm);font-size:.6rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:2px}
.menu{display:flex;flex-direction:column;gap:10px;padding:16px}
.menuitem{display:flex;align-items:center;gap:12px;border:var(--st) solid var(--ink);border-radius:var(--r-lg);background:var(--pp);padding:15px;font-weight:700;cursor:pointer}
.menuitem .chev{margin-left:auto;color:var(--subtle)}
.menuitem.tilt:nth-child(odd){transform:rotate(-1deg)}
.menuitem.tilt:nth-child(even){transform:rotate(1deg)}

/* toast */
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);z-index:40;background:var(--ink);color:#fff;font-weight:700;font-size:.86rem;padding:12px 18px;border-radius:var(--r-pill);display:flex;align-items:center;gap:9px;opacity:0;pointer-events:none;transition:opacity .25s var(--ease),transform .25s var(--ease)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast img{width:24px;height:24px}

/* ============================ B1 STICKER PROFILE ============================ */
.profile-screen{background:var(--yellow);height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden}
.profile-screen .ptop{display:flex;align-items:center;justify-content:space-between;padding:18px 20px}
.profile-screen .ptop .x,.profile-screen .ptop .gear{width:40px;height:40px;border-radius:50%;border:var(--st) solid var(--ink);background:var(--pp);display:flex;align-items:center;justify-content:center;font-size:1rem;cursor:pointer}
.profile-screen .ptop .ttl{font-family:var(--fm);font-size:.78rem;letter-spacing:.2em;text-transform:uppercase}
.profile-screen .pstk{position:absolute;top:62px;right:22px;width:78px;height:78px;z-index:1;animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tilts{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:16px;padding:18px 22px 0;position:relative;z-index:2}
.tilt{font-family:var(--fd);text-transform:uppercase;letter-spacing:-.01em;font-size:1.7rem;padding:14px 30px;border-radius:var(--r-pill);border:var(--st) solid var(--ink);cursor:pointer;transition:transform .28s var(--ease)}
.tilt:nth-child(1){transform:rotate(-4deg);background:var(--pink)}
.tilt:nth-child(2){transform:rotate(2.5deg);background:var(--green);margin-left:24px}
.tilt:nth-child(3){transform:rotate(-2deg);background:var(--pp);margin-left:8px}
.tilt:nth-child(4){transform:rotate(3deg);background:var(--blue);margin-left:40px}
.tilt:nth-child(5){transform:rotate(-3deg);background:var(--pp);margin-left:14px}
@media(hover:hover){.tilt:hover{transform:rotate(0) scale(1.04)}}
.tilt:active{transform:rotate(0) scale(.97)}
.qsheet{background:var(--pp);border-top-left-radius:var(--r-2xl);border-top-right-radius:var(--r-2xl);border-top:var(--st) solid var(--ink);border-left:var(--st) solid var(--ink);border-right:var(--st) solid var(--ink);margin:0 14px;padding:16px;display:flex;gap:12px}
.qsheet .qa{flex:1;border-radius:var(--r-lg);border:var(--st) solid var(--ink);padding:15px;min-height:118px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;position:relative;overflow:hidden}
.qsheet .qa .qi{font-size:1.2rem}
.qsheet .qa .qn{font-weight:700;font-size:.95rem;line-height:1.1}
.qsheet .qa.pink{background:var(--pink)}
.qsheet .qa.purple{background:var(--purple);color:#fff}

/* ============================ CHOICE MODAL (B3) ============================ */
.overlay{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:22px;background:rgba(18,18,18,.001);opacity:0;visibility:hidden;transition:opacity .26s var(--ease),visibility .26s}
.overlay.fill{background:var(--purple)} /* full-bleed accent behind modal */
.overlay.fill-green{background:var(--green)}
.overlay.scrim{background:rgba(18,18,18,.5)}
.overlay.open{opacity:1;visibility:visible}
.modal{background:var(--pp);border:var(--st) solid var(--ink);border-radius:var(--r-2xl);padding:24px 20px;width:100%;max-width:340px;text-align:center;position:relative;transform:scale(.94);transition:transform .26s var(--ease)}
.overlay.open .modal{transform:scale(1)}
.modal .bub{display:flex;justify-content:center;margin-bottom:6px}
.modal .bub img{width:64px;height:64px;margin-top:-46px}
.modal h3{font-family:var(--fd);text-transform:uppercase;font-size:1.5rem;line-height:.95;letter-spacing:-.02em}
.modal p{color:var(--muted);font-size:.92rem;margin-top:8px;margin-bottom:18px}
.modal .opts{display:flex;flex-direction:column;gap:10px}
.modal .opts .ghost{background:none;border:none;color:var(--muted);font-weight:700;font-family:var(--fb);padding:6px;cursor:pointer}
.modal .ovstk{position:absolute;z-index:1;width:64px;height:64px}

/* ============================ ONE-WAY FLOW (checkout / create) ============================ */
.oneway{height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden}
.oneway.pu{background:var(--purple);color:#fff}
.oneway.ye{background:var(--yellow)}
.oneway.gr{background:var(--green)}
.oneway .owtop{display:flex;align-items:center;gap:12px;padding:16px 20px}
.oneway .owtop .x{width:38px;height:38px;border-radius:50%;border:var(--st) solid currentColor;display:flex;align-items:center;justify-content:center;cursor:pointer;background:transparent;color:inherit}
.oneway.pu .owtop .x{border-color:rgba(255,255,255,.5)}
.oneway .owtop .step{font-family:var(--fm);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;opacity:.9}
.oneway .owtop .prog{margin-left:auto;display:flex;gap:5px}
.oneway .owtop .prog i{width:22px;height:5px;border-radius:3px;background:currentColor;opacity:.3}
.oneway .owtop .prog i.on{opacity:1}
.owstk{position:absolute;z-index:1;width:64px;height:64px}
.owcard{background:var(--pp);color:var(--ink);border:var(--st) solid var(--ink);border-radius:var(--r-2xl);margin:auto 20px;padding:24px 22px;position:relative;z-index:2;display:flex;flex-direction:column;gap:14px;max-height:calc(100% - 200px);overflow-y:auto}
.owcard::-webkit-scrollbar{width:0}
.owcard .lead{font-family:var(--fm);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.owcard h3{font-family:var(--fd);text-transform:uppercase;font-size:1.7rem;line-height:.95;letter-spacing:-.02em}
.owcard p{color:var(--muted);font-size:.92rem}
.owcard .ownav{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.owcard .ownav .n{font-family:var(--fm);font-size:.8rem;color:var(--muted)}
.owcard .next{width:54px;height:54px;border-radius:50%;background:var(--ink);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
.owcard .nextwide{background:var(--ink);color:#fff;border:none;border-radius:var(--r-pill);padding:15px 24px;font-weight:700;font-family:var(--fb);cursor:pointer;width:100%}
.optcard{display:flex;align-items:center;gap:12px;border:var(--st) solid var(--ink);border-radius:var(--r-lg);padding:14px;cursor:pointer;text-align:left;background:var(--pp);font-family:var(--fb)}
.optcard.sel{background:var(--ink);color:#fff}
.optcard .oi{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-size:1.1rem;border:var(--st) solid currentColor}
.optcard .ot{font-weight:700}.optcard .od{font-size:.76rem;opacity:.7;font-family:var(--fm)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-family:var(--fm);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.field input,.field textarea{border:var(--st) solid var(--ink);border-radius:var(--r-md);padding:12px 14px;font-family:var(--fb);font-size:.92rem;outline:none;background:var(--pp);width:100%}
.field input:focus,.field textarea:focus{border-color:var(--purple)}
.warn{display:flex;gap:9px;align-items:flex-start;background:var(--ys);border:var(--st) solid var(--ink);border-radius:var(--r-md);padding:11px;font-size:.8rem}
.reviewline{display:flex;justify-content:space-between;font-size:.9rem;padding:9px 0;border-bottom:var(--st) solid var(--p2)}
.reviewline .k{color:var(--muted)}

/* ============================ ORDERS / TIMELINE / REVIEW ============================ */
.orow{display:flex;align-items:center;gap:12px;border:var(--st) solid var(--ink);border-radius:var(--r-lg);background:var(--pp);padding:12px;margin-bottom:10px;cursor:pointer}
.orow .th{width:54px;height:54px;border-radius:var(--r-md);border:var(--st) solid var(--ink);object-fit:cover;flex:0 0 auto}
.orow .t{font-weight:700;font-size:.9rem;line-height:1.1}
.orow .sub{font-family:var(--fm);font-size:.66rem;color:var(--subtle);margin-top:3px}
.statuschip{font-family:var(--fm);font-size:.6rem;font-weight:700;text-transform:uppercase;padding:4px 9px;border-radius:var(--r-pill);border:var(--st) solid var(--ink)}
.statuschip.paid{background:var(--green)}.statuschip.ship{background:var(--blue)}.statuschip.done{background:var(--ink);color:#fff}.statuschip.pend{background:var(--yellow)}
.timeline{position:relative;padding-left:30px;margin:8px 0}
.timeline::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--ink)}
.tnode{position:relative;margin-bottom:18px}
.tnode::before{content:"";position:absolute;left:-26px;top:2px;width:16px;height:16px;border-radius:50%;border:var(--st) solid var(--ink);background:var(--pp)}
.tnode.on::before{background:var(--green)}
.tnode .tt{font-weight:700;font-size:.9rem}
.tnode .td{font-family:var(--fm);font-size:.66rem;color:var(--subtle);margin-top:2px}
.stars{display:flex;gap:8px;justify-content:center;font-size:2rem;margin:8px 0}
.stars button{background:none;border:none;cursor:pointer;color:var(--ink);opacity:.25;transition:opacity .15s,transform .15s}
.stars button.on{opacity:1;color:var(--yellow);transform:scale(1.1)}

/* ============================ SHOP / COMMUNITY ============================ */
.shopbanner{height:120px;position:relative;border-bottom:var(--st) solid var(--ink)}
.shopbanner img{width:100%;height:100%;object-fit:cover}
.shopav{width:74px;height:74px;border-radius:18px;border:var(--st) solid var(--ink);object-fit:cover;margin-top:-44px;position:relative;background:var(--yellow)}
.followbtn{border:var(--st) solid var(--ink);background:var(--purple);color:#fff;border-radius:var(--r-pill);padding:10px 22px;font-weight:700;font-family:var(--fb);cursor:pointer}
.followbtn.on{background:var(--pp);color:var(--ink)}
.tabs{display:flex;gap:8px;border-bottom:var(--st) solid var(--ink);padding:0 16px}
.tabs button{background:none;border:none;padding:12px 4px;font-weight:700;font-family:var(--fb);cursor:pointer;border-bottom:3px solid transparent;color:var(--muted)}
.tabs button.on{color:var(--ink);border-color:var(--purple)}
.commrow{display:flex;align-items:center;gap:12px;border:var(--st) solid var(--ink);border-radius:var(--r-lg);background:var(--pp);padding:13px;margin-bottom:10px;cursor:pointer}
.commrow .ci{width:48px;height:48px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;flex:0 0 auto;border:var(--st) solid var(--ink)}

/* empty / loading */
.empty{text-align:center;padding:70px 24px}
.empty img{width:80px;margin:0 auto 16px}
.skel{background:linear-gradient(90deg,var(--p2) 25%,#e3e0d8 50%,var(--p2) 75%);background-size:200% 100%;animation:sh 1.2s linear infinite;border-radius:var(--r-md)}
@keyframes sh{to{background-position:-200% 0}}

/* ============================ CHOSEN CARDS (from explorations) ============================ */
i[class^="ph"],i[class*=" ph"]{line-height:1;display:inline-block}

/* H1 — overlay-bottom + numeral (featured carousel item) */
.h1c{position:relative;border-radius:var(--r-xl);border:var(--st) solid var(--ink);overflow:hidden;height:300px;color:#fff;cursor:pointer}
.h1c .imgwrap{position:absolute;inset:0}.h1c .imgwrap img{width:100%;height:100%;object-fit:cover}
.h1c::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(0,0,0,.82))}
.h1c .num{position:absolute;top:14px;left:16px;z-index:2;font-family:var(--fd);font-size:2.4rem;mix-blend-mode:difference}
.h1c .chips{position:absolute;top:16px;right:14px;z-index:2;display:flex;gap:6px}
.h1c .stk{position:absolute;z-index:2;width:48px;height:48px;top:52px;right:16px}
.h1c .cap{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:18px}
.h1c .cap h3{font-family:var(--fd);text-transform:uppercase;font-size:1.6rem;line-height:.92;letter-spacing:-.02em}
.h1c .cap .meta{display:flex;align-items:baseline;justify-content:space-between;margin-top:8px}
.h1c .cap .pr{font-family:var(--fm);font-weight:700;font-size:1.1rem}
.h1c .cap .loc{font-family:var(--fm);font-size:.74rem;opacity:.85}
/* carousel rail */
.carousel{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px 4px;scroll-behavior:smooth}
.carousel::-webkit-scrollbar{height:0}
.carousel>*{flex:0 0 86%;scroll-snap-align:center}

/* H2 — split, text on purple (category feature) */
.h2c{display:grid;grid-template-columns:1fr 1.05fr;height:220px;background:var(--purple);color:#fff;border-radius:var(--r-xl);border:var(--st) solid var(--ink);overflow:hidden;cursor:pointer;position:relative}
.h2c .imgwrap{height:100%}.h2c .imgwrap img{width:100%;height:100%;object-fit:cover}
.h2c .side{padding:18px;display:flex;flex-direction:column;justify-content:space-between}
.h2c .side .k{font-family:var(--fm);font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:#cfcbff}
.h2c .side h3{font-family:var(--fd);text-transform:uppercase;font-size:1.5rem;line-height:.92;letter-spacing:-.02em;margin-top:auto}
.h2c .side .pr{font-family:var(--fm);font-weight:700;font-size:1.05rem;margin-top:8px}
.h2c .side .go{margin-top:12px;align-self:flex-start;background:#fff;color:var(--purple);border:none;border-radius:var(--r-pill);padding:9px 18px;font-weight:700;font-family:var(--fb);display:inline-flex;align-items:center;gap:6px}

/* H4 — full-bleed accent, inset photo (break card, centered) */
.h4c{background:var(--green);padding:16px;border-radius:var(--r-xl);border:var(--st) solid var(--ink);display:flex;flex-direction:column;cursor:pointer}
.h4c .top{display:flex;justify-content:space-between;align-items:center}
.h4c .top .k{font-family:var(--fm);font-size:.64rem;letter-spacing:.1em;text-transform:uppercase}
.h4c .imgwrap{height:190px;border-radius:var(--r-lg);border:var(--st) solid var(--ink);margin:14px 0;overflow:hidden}
.h4c .imgwrap img{width:100%;height:100%;object-fit:cover}
.h4c h3{font-family:var(--fd);text-transform:uppercase;font-size:1.4rem;line-height:.92;letter-spacing:-.02em}
.h4c .row{display:flex;align-items:baseline;justify-content:space-between;margin-top:5px}
.h4c .pr{font-family:var(--fm);font-weight:700;font-size:1.1rem}

/* H5 — wide editorial w/ description (DEFAULT list card) */
.h5c{display:grid;grid-template-columns:42% 1fr;background:var(--pp);border-radius:var(--r-lg);border:var(--st) solid var(--ink);overflow:hidden;cursor:pointer;min-height:158px}
.h5c .imgwrap{border-right:var(--st) solid var(--ink);overflow:hidden}
.h5c .imgwrap img{width:100%;height:100%;object-fit:cover}
.h5c .side{padding:15px;display:flex;flex-direction:column}
.h5c .side .tagrow{display:flex;gap:6px;margin-bottom:9px;flex-wrap:wrap}
.h5c .side h3{font-family:var(--fd);text-transform:uppercase;font-size:1.12rem;line-height:.95;letter-spacing:-.02em}
.h5c .side p{color:var(--muted);font-size:.8rem;margin-top:7px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.h5c .side .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:10px}
.h5c .side .pr{font-family:var(--fm);font-weight:700;font-size:1.15rem}
.h5c .side .loc{font-family:var(--fm);font-size:.66rem;color:var(--subtle)}

/* P1 — roomy, price chip (near-you horizontal scroll) */
.p1c{flex:0 0 200px;border-radius:var(--r-lg);border:var(--st) solid var(--ink);overflow:hidden;background:var(--pp);cursor:pointer;scroll-snap-align:start}
.p1c .imgwrap{height:150px;overflow:hidden}.p1c .imgwrap img{width:100%;height:100%;object-fit:cover}
.p1c .b{padding:13px}
.p1c .t{font-weight:700;font-size:.92rem;line-height:1.12}
.p1c .row{display:flex;align-items:center;justify-content:space-between;margin-top:11px}
.p1c .pr{font-family:var(--fm);font-weight:700;font-size:.86rem;background:var(--yellow);border:var(--st) solid var(--ink);border-radius:var(--r-pill);padding:5px 11px}
.p1c .loc{font-family:var(--fm);font-size:.64rem;color:var(--subtle)}

/* Solid compact — hard color + text + element, full size (category tiles) */
.solidc{border-radius:var(--r-lg);border:var(--st) solid var(--ink);padding:16px;min-height:120px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;cursor:pointer}
.solidc .k{font-family:var(--fm);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.solidc .l{font-family:var(--fd);text-transform:uppercase;font-size:1.3rem;line-height:.95;letter-spacing:-.02em}
.solidc .stk{position:absolute;right:-8px;bottom:-8px;width:58px;height:58px}
.solidc.g{background:var(--green)}.solidc.y{background:var(--yellow)}.solidc.b{background:var(--blue)}.solidc.p{background:var(--pink)}.solidc.o{background:var(--orange)}.solidc.pu{background:var(--purple);color:#fff}

/* PDF Issue 3: titles wrap to 2 lines, never truncate mid-word */
.h5c .side h3{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* top-seller card (home rail) */
.sellerc{flex:0 0 188px;scroll-snap-align:start;border-radius:var(--r-lg);border:var(--st) solid var(--ink);padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.sellerc.p{background:var(--pink)}.sellerc.b{background:var(--blue)}.sellerc.g{background:var(--green)}.sellerc.y{background:var(--yellow)}.sellerc.o{background:var(--orange)}
.sellerc .srow{display:flex;align-items:center;justify-content:space-between}
.sellerc .sav{width:48px;height:48px;border-radius:13px;border:var(--st) solid var(--ink);object-fit:cover}
.sellerc .srank{font-family:var(--fm);font-weight:700;font-size:.78rem;background:var(--ink);color:#fff;border-radius:var(--r-pill);padding:4px 9px}
.sellerc .sname{font-family:var(--fd);text-transform:uppercase;font-size:1rem;line-height:.95;margin-top:8px}
.sellerc .shandle{font-family:var(--fm);font-size:.68rem;opacity:.7}
.sellerc .sfoot{display:flex;align-items:center;justify-content:space-between;margin-top:10px;font-family:var(--fm);font-weight:700;font-size:.74rem}

/* ============================ COLORED CATEGORY SCREEN ============================ */
.catscreen{height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden}
.cathero{padding:16px 18px 22px;position:relative;border-bottom:var(--st) solid var(--ink);overflow:hidden;flex:0 0 auto}
.cathero .ctop{display:flex;align-items:center;justify-content:space-between}
.cathero .x{width:40px;height:40px;border-radius:50%;border:var(--st) solid var(--ink);background:var(--pp);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.cathero .kk{font-family:var(--fm);font-size:.66rem;letter-spacing:.18em;text-transform:uppercase}
.cathero h1{font-family:var(--fd);text-transform:uppercase;font-size:3rem;line-height:.86;letter-spacing:-.03em;margin-top:18px}
.cathero .sub{font-family:var(--fm);font-size:.82rem;margin-top:10px;opacity:.85}
.cathero .bigstk{position:absolute;right:-14px;top:42px;width:120px;height:120px;opacity:.9;animation:spin 22s linear infinite}
.cathero.on,.cathero.on .x{color:#fff}
.cathero.on .x{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.6)}
/* enter pop for the colored hero */
@keyframes catpop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.screen.active .cathero{animation:catpop .42s var(--ease) both}

/* ============================ COMMUNITY (creative bento) ============================ */
.commhero{padding:18px 16px;position:relative;overflow:hidden}
.commhero h1{font-family:var(--fd);text-transform:uppercase;font-size:2.4rem;line-height:.9;letter-spacing:-.02em}
.commhero h1 .swap{display:inline-block;height:.74em;vertical-align:-.08em;animation:spin 9s linear infinite}
.commhero p{color:var(--muted);font-size:.92rem;margin-top:10px;max-width:88%}
.commbento{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.commtile{border-radius:var(--r-lg);border:var(--st) solid var(--ink);padding:15px;min-height:128px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;cursor:pointer}
.commtile.wide{grid-column:1 / -1;min-height:96px;flex-direction:row;align-items:center;gap:14px}
.commtile.p{background:var(--pink)}.commtile.y{background:var(--yellow)}.commtile.g{background:var(--green)}.commtile.b{background:var(--blue)}.commtile.pu{background:var(--purple);color:#fff}
.commtile .emoji{font-size:1.7rem}
.commtile .nm{font-family:var(--fd);text-transform:uppercase;font-size:1.15rem;line-height:.95;margin-top:auto}
.commtile .mc{font-family:var(--fm);font-size:.66rem;margin-top:6px;opacity:.8}
.commtile .stk{position:absolute;right:-10px;bottom:-10px;width:54px;height:54px;opacity:.85}
.commtile.wide .avstack{display:flex;flex:0 0 auto}
.commtile.wide .avstack img{width:34px;height:34px;border-radius:50%;border:var(--st) solid var(--ink);object-fit:cover;margin-left:-12px}
.commtile.wide .avstack img:first-child{margin-left:0}
/* community detail header */
.commdhead{position:relative;border-bottom:var(--st) solid var(--ink)}
.commdhead .banner{height:130px;position:relative;overflow:hidden}
.commdhead .banner img{width:100%;height:100%;object-fit:cover}
.commdhead .bd{padding:0 16px 14px}
.commdhead .badge{width:64px;height:64px;border-radius:18px;border:var(--st) solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:1.9rem;margin-top:-34px;position:relative;background:var(--yellow)}
.commdhead h1{font-family:var(--fd);text-transform:uppercase;font-size:1.7rem;margin-top:10px}
.commstat{display:flex;gap:10px;margin-top:12px}
.commstat .cs{flex:1;background:var(--pp);border:var(--st) solid var(--ink);border-radius:var(--r-md);padding:9px;text-align:center}
.commstat .cs .n{font-family:var(--fm);font-weight:700;font-size:1.05rem}
.commstat .cs .k{font-family:var(--fm);font-size:.56rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:2px}

/* two-group labeled filter (PDF: type vs category) */
.filtergroup{padding:0 16px}
.filterlbl{font-family:var(--fm);font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--subtle);margin:2px 0 7px}
.filterbreak{height:var(--st);background:var(--p2);margin:12px 16px}

/* in-thread system review prompt (PDF Issue 1) */
.sysprompt{align-self:stretch;background:var(--pp);border:var(--st) solid var(--ink);border-radius:var(--r-lg);padding:14px;display:flex;flex-direction:column;gap:10px}
.sysprompt .sp-h{display:flex;align-items:center;gap:8px;font-weight:700}
.sysprompt .sp-h .badge{width:30px;height:30px;border-radius:9px;background:var(--yellow);border:var(--st) solid var(--ink);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.sysprompt .sp-d{font-size:.84rem;color:var(--muted)}
.sysprompt .sp-row{display:flex;gap:8px;flex-wrap:wrap}
.sysprompt .sp-row .pill{cursor:pointer}

/* claim / seller-to-buyer recs */
.claimamt{background:var(--green);border:var(--st) solid var(--ink);border-radius:var(--r-2xl);padding:24px;text-align:center;position:relative;overflow:hidden}
.claimamt .big{font-family:var(--fm);font-weight:700;font-size:2.6rem;line-height:.95}
.claimamt .k{font-family:var(--fm);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;margin-top:6px}
.claimamt .stk{position:absolute;width:48px;height:48px}
.recrow{display:flex;align-items:center;gap:12px;border:var(--st) solid var(--ink);border-radius:var(--r-lg);background:var(--pp);padding:11px;margin-bottom:10px;cursor:pointer}
.recrow .th{width:50px;height:50px;border-radius:var(--r-md);border:var(--st) solid var(--ink);object-fit:cover;flex:0 0 auto}
.recrow .t{font-weight:700;font-size:.9rem;line-height:1.1}
.recrow .pr{font-family:var(--fm);font-weight:700;font-size:.82rem;margin-top:3px}
.recrow .buyc{margin-left:auto;background:var(--ink);color:#fff;border:none;border-radius:var(--r-pill);padding:9px 13px;font-weight:700;font-family:var(--fb);font-size:.78rem;cursor:pointer;flex:0 0 auto}

/* section title with optional "see all" */
.sectitle .see{font-family:var(--fb);font-weight:700;font-size:.8rem;color:var(--purple);background:none;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:4px}

/* ============================ PREMIUM TRANSITIONS ============================ */
/* staggered enter for feed children */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.stagger>*{animation:rise .5s var(--ease) both}
/* hover lift on desktop only */
@media (hover:hover){
  .h5c,.p1c,.h4c,.h2c,.h1c,.solidc{transition:transform .25s var(--ease)}
  .h5c:hover,.p1c:hover,.h4c:hover,.h2c:hover,.h1c:hover,.solidc:hover{transform:translateY(-3px)}
}
/* sticky bar gains a hairline shadow-free separation when scrolled (stroke only) */
.bar{transition:border-color .2s var(--ease)}
/* number pop when cart badge changes */
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.bump{animation:pop .35s var(--ease)}
</style>
</head>

<script>
/* ============================ DATA ============================ */
const U = (id,w=800)=>`https://images.unsplash.com/photo-${id}?w=${w}`;
const L = [
  {id:'lst_007',t:'Risograph zine — "Soft Static" no.4',pr:12000,tot:13500,loc:'Berlin',cat:'Art & Print',type:'Physical',cond:'New',img:'1544716278-ca5e3f4abd8c',tint:'ps',seller:'ekko',rating:4.8,nrev:81,desc:'32 pages, 2-color riso on recycled stock. Limited run of 100.'},
  {id:'lst_001',t:'Hand-thrown stoneware mug',pr:18000,tot:20500,loc:'Lisbon',cat:'Ceramics',type:'Physical',cond:'New',img:'1514228742587-6b1558fcca3d',tint:'ys',seller:'alice',rating:4.8,nrev:7,desc:'Wheel-thrown, matte oatmeal glaze. Holds ~350ml. Batch of six.'},

  {id:'lst_011',t:'Cast-iron skillet, seasoned',pr:42000,tot:47000,loc:'Reykjavik',cat:'Kitchen',type:'Resale',cond:'Used · Good',img:'1593618998160-e34014e67546',tint:'ys',seller:'mara.knits',rating:4.7,nrev:7,desc:'10-inch pre-seasoned lifetime piece. Light surface patina.'},

  {id:'lst_016',t:'Wool throw blanket',pr:78000,tot:84000,loc:'Reykjavik',cat:'Home',type:'Physical',cond:'New',img:'1580301762395-21ce84d00bc6',tint:'bs',seller:'mara.knits',rating:4.9,nrev:7,desc:'Lambswool herringbone, 130×170cm. Natural undyed.'},
  {id:'lst_008',t:'Lightroom preset pack',pr:28000,tot:28000,loc:'Remote',cat:'Photography',type:'Digital',cond:'New',img:'1542038784456-1ea8e935640e',tint:'ys',seller:'daveshoots',rating:4.9,nrev:6,desc:'12 presets emulating classic film stocks. Instant download.'}
];
const byId = id => L.find(x=>x.id===id);
const sats = n => n.toLocaleString('en-US');
const AV = {ekko:'1521119989659-a83eee488004',alice:'1494790108377-be9c29b29330','daveshoots':'1507003211169-0a1dd7228f2d','carol.makes':'1438761681033-6461ffad8d80','bobbuilds':'1500648767791-00dcc994a43e','mara.knits':'1534528741775-53994a69daeb'};
const TINT = {ys:'var(--ys)',gs:'var(--gs)',ps:'var(--ps)',bs:'var(--bs)'};
// category → accent (drives the colored category screen + tiles). 'on' = needs white text.
const CATC = {
  'Ceramics':{c:'green',k:'g',sk:'shape-smiley.svg'},
  'Apparel':{c:'pink',k:'p',sk:'shape-heart-circle.svg',on:false},
  'Photography':{c:'blue',k:'b',sk:'shape-sunstar-purple.svg'},
  'Electronics':{c:'orange',k:'o',sk:'shape-starburst.svg'},
  'Art & Print':{c:'pink',k:'p',sk:'shape-sparkle-4pt.svg'},
  'Coffee':{c:'yellow',k:'y',sk:'shape-daisy-yellow.svg'},
  'Kitchen':{c:'yellow',k:'y',sk:'shape-sun-rays.svg'},
  'Home':{c:'blue',k:'b',sk:'shape-hand.svg'},
  'Photography ':{c:'blue',k:'b'}
};
const catMeta = c => CATC[c] || {c:'purple',k:'pu',sk:'shape-sparkle-4pt.svg',on:true};
// PDF Issue 3: one price style; "Free"/"Contact" instead of "0 sats".
const priceStr = l => l.pr>0 ? `${sats(l.pr)} sats` : (l.free==='contact'?'Contact for price':'Free');
// PDF Issue 4 / wallet-aware buy: current Shopstr wallet balance (sats).
const WALLET_BAL = 182400;
// Top sellers (home section) — derived-looking mock.
const SELLERS = [
  {h:'ekko',n:'Riso & Print',rating:4.9,sales:312,k:'p',cat:'Art & Print'},
  {h:'mara.knits',n:'Slow Textiles',rating:4.9,sales:204,k:'b',cat:'Apparel'},
  {h:'alice',n:'Clay by Alice',rating:4.8,sales:178,k:'g',cat:'Ceramics'},
  {h:'daveshoots',n:'Dave Shoots Film',rating:4.9,sales:96,k:'y',cat:'Photography'}
];

/* ============================ STATE ============================ */
const state = { cart:[ {id:'lst_001',q:1}, {id:'lst_003',q:2,size:'M'} ], pay:'lightning', current:null, co:{type:'ship'}, msgCtx:null, msgFromListing:false, payout:'shopstr' };
const cartCount = () => state.cart.reduce((n,c)=>n+c.q,0);
const cartTotal = () => state.cart.reduce((n,c)=>n+byId(c.id).pr*c.q,0);

/* ============================ ROUTER ============================ */
const stage = document.getElementById('stage');
const NAVMAP = {market:'market',communities:'communities',messages:'messages',wallet:'wallet',profile:'profile'};
let activeEl=null;
function go(name, arg){
  if(!SCREENS[name]){ toast('Coming soon'); return; }
  const html = SCREENS[name](arg);
  const el = document.createElement('section');
  el.className='screen'; el.dataset.name=name; if(arg!=null) el.dataset.arg=arg; el.innerHTML=html;
  stage.appendChild(el);
  // leave old
  const old=activeEl;
  requestAnimationFrame(()=>{ el.classList.add('active'); if(old){ old.classList.add('leaving'); old.classList.remove('active'); setTimeout(()=>old.remove(),300);} });
  activeEl=el;
  // hide the global bottom nav on screens that own their bottom bar / are immersive
  const NAV_HIDDEN=['listing','thread','paid','co_type','co_ship','co_pickup','co_account','co_pay','co_review','sellerNew','review','onboard','profile','payoutSetup','walletSend','walletReceive','withdrawHold'];
  document.getElementById('nav').style.display = NAV_HIDDEN.includes(name)?'none':'';
  // nav highlight
  const navName = NAVMAP[name] ? name
    : (name==='listing'||name==='search'||name==='category'||name==='newfeed'||name==='nearme'||name==='following'||name==='cart'?'market'
    : name==='community'?'communities'
    : name==='thread'?'messages'
    : name==='walletSend'||name==='walletReceive'||name==='claim'?'wallet':null);
  document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('on', b.dataset.go===navName));
  el.querySelector('.scroll')?.scrollTo(0,0);
  bind(el);
}
function toast(msg, sticker){
  const t=document.getElementById('toast');
  t.innerHTML=(sticker?`<img src="assets/${sticker}.svg" alt="">`:'')+msg;
  t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1800);
}

/* ============================ SCREENS ============================ */
const SCREENS = {

    const feat=[L[0],L[2],L[4]];           // H1 carousel

          <div class="solidc p press" data-go="category" data-cat="Art & Print"><span class="k">Shop</span><span class="l">Zines &amp; print</span><img class="stk" src="assets/shape-sparkle-4pt.svg" alt=""></div>

/* ============================ INTERACTIONS ============================ */
const history=[];
function bind(el){
  // navigation via data-go
  el.querySelectorAll('[data-go]').forEach(n=>n.addEventListener('click',e=>{
    e.stopPropagation();
    const name=n.dataset.go;
    const arg=n.dataset.id||n.dataset.slug||n.dataset.cat||n.dataset.seller||n.dataset.comm;
    if(activeEl) history.push({name:activeEl.dataset.name, arg:activeEl.dataset.arg});
    go(name,arg);
  }));
  // back
  el.querySelectorAll('[data-back]').forEach(b=>b.addEventListener('click',()=>{ const prev=history.pop(); go(prev?prev.name:'market', prev?prev.arg:undefined); }));
  // search toggle
  el.querySelectorAll('[data-toggle="search"]').forEach(b=>b.addEventListener('click',()=>{
    const d=el.querySelector('[data-disc]'); d.classList.toggle('open'); if(d.classList.contains('open')) d.querySelector('input')?.focus();
  }));
  // filters → pretend filter + toast
  el.querySelectorAll('[data-filter]').forEach(f=>f.addEventListener('click',()=>{
    const [grp,val]=f.dataset.filter.split(':');
    // toggle selection within this filter's own group
    f.closest('.filters').querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('ink',x===f));
    if(grp==='cat'&&val!=='All'){ history.push({name:activeEl.dataset.name,arg:activeEl.dataset.arg}); go('category',val); }
    else toast(grp==='type'?`Type · ${val}`:'Showing everything','shape-sparkle-4pt');
  }));
  // size select
  el.querySelectorAll('[data-sizes] [data-size]').forEach(s=>s.addEventListener('click',()=>{ el.querySelectorAll('[data-size]').forEach(x=>x.classList.remove('ink')); s.classList.add('ink'); }));
  // add to cart
  el.querySelectorAll('[data-addcart]').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation(); const id=b.dataset.addcart; const ex=state.cart.find(c=>c.id===id);
    if(ex) ex.q++; else state.cart.push({id,q:1});
    updateBadges(); pop(b); toast('Added to cart','shape-sparkle-4pt');
  }));
  // buy now → checkout machine (ensure item in cart context, skip cart)
  el.querySelectorAll('[data-buynow]').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation(); const id=b.dataset.buynow; if(!state.cart.find(c=>c.id===id)) state.cart.unshift({id,q:1}); updateBadges(); history.push({name:'listing'}); go('co_type');
  }));
  // checkout: order-type select
  el.querySelectorAll('[data-cotype]').forEach(b=>b.addEventListener('click',()=>{ state.co.type=b.dataset.cotype; el.querySelectorAll('[data-cotype]').forEach(x=>x.classList.toggle('sel',x===b)); }));
  // payout selection (inverted default)
  el.querySelectorAll('[data-payout]').forEach(b=>b.addEventListener('click',()=>{ state.payout=b.dataset.payout; el.querySelectorAll('[data-payout]').forEach(x=>x.classList.toggle('sel',x===b)); }));
  // checkout: next from order-type branches to ship or pickup
  el.querySelectorAll('[data-conext]').forEach(b=>b.addEventListener('click',()=>{ history.push({name:'co_type'}); go(state.co.type==='pickup'?'co_pickup':'co_ship'); }));
  // checkout field capture
  el.querySelectorAll('[data-cofield]').forEach(f=>f.addEventListener('input',()=>{ state.co[f.dataset.cofield]=f.value; }));
  // delayed-wall sign in
  el.querySelectorAll('[data-signin]').forEach(b=>b.addEventListener('click',()=>openSignin()));
  // PDF Issue 2: Message Seller from a listing carries product context into the thread
  el.querySelectorAll('[data-msg-listing]').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation(); state.msgCtx=b.dataset.msgListing; state.msgFromListing=true;
    history.push({name:activeEl.dataset.name,arg:activeEl.dataset.arg}); go('thread', b.dataset.seller);
  }));
  // review-prompt branches (PDF Issue 1)
  el.querySelectorAll('[data-review-snooze]').forEach(b=>b.addEventListener('click',()=>{ b.closest('.sysprompt').style.opacity='.5'; toast('Snoozed 3 days','shape-sparkle-4pt'); }));
  el.querySelectorAll('[data-review-problem]').forEach(b=>b.addEventListener('click',()=>openModal({sticker:'badge-new-speech',scrim:true,title:'Report a problem',body:'This opens a dispute thread with @ekko. When escrow ships, refunds resolve here.',opts:[{label:'Open dispute',tone:'pu',act:()=>toast('Dispute opened')},{label:'Cancel',ghost:true}]})));
  // save-key reminder (post-payment, first-class moment)
  el.querySelectorAll('[data-act="savekey"]').forEach(b=>b.addEventListener('click',()=>openModal({sticker:'badge-bff-star',title:'Back up your key',body:'Save your nsec or set a passphrase. Lose it and the seller can no longer reach you about this order.',opts:[{label:'Save with passphrase',tone:'pu',act:()=>toast('Key secured ✦','badge-bff-star')},{label:'Copy nsec',tone:'w',act:()=>toast('nsec copied')},{label:'Later',ghost:true}]})));
  // profile quick actions
  el.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>{
    if(b.dataset.act==='rate') openModal({sticker:'badge-new-speech',title:'Enjoying Shopstr?',body:'A quick rating helps other buyers find good sellers.',opts:[{label:'Rate 5 stars ★',tone:'pu',act:()=>toast('Thanks!','shape-sparkle-4pt')},{label:'Maybe later',ghost:true}]});
    else if(b.dataset.act==='newcomm') openModal({sticker:'badge-bff-star',title:'Start a community',body:'Name a corner of the market and invite sellers. Published as a NIP-72 group you moderate.',opts:[{label:'Create community',tone:'pu',act:()=>toast('Community created ✦','badge-bff-star')},{label:'Maybe later',ghost:true}]});
    else openModal({sticker:'badge-bff-star',fill:'fill-green',title:'Share your shop',body:'Copy your shopfront link and share it anywhere.',opts:[{label:'Copy link',tone:'pu',act:()=>toast('Link copied','shape-sparkle-4pt')},{label:'Close',ghost:true}]});
  }));
  // cart qty
  el.querySelectorAll('[data-inc]').forEach(b=>b.addEventListener('click',()=>{ const c=state.cart.find(x=>x.id===b.dataset.inc); c.q++; go('cart'); }));
  el.querySelectorAll('[data-dec]').forEach(b=>b.addEventListener('click',()=>{ const c=state.cart.find(x=>x.id===b.dataset.dec); c.q--; if(c.q<=0) state.cart=state.cart.filter(x=>x!==c); updateBadges(); go('cart'); }));
  // payment segment
  el.querySelectorAll('[data-payseg] [data-pay]').forEach(b=>b.addEventListener('click',()=>{
    state.pay=b.dataset.pay; el.querySelectorAll('[data-pay]').forEach(x=>x.classList.toggle('on',x===b)); renderPay(el);
  }));
  if(el.querySelector('[data-paybody]')) renderPay(el);
  // pay confirm → paid
  el.querySelectorAll('[data-pay-confirm]').forEach(b=>b.addEventListener('click',()=>{ go('paid'); }));
  // paid screen: clear cart + run check draw
  if(el.querySelector('[data-paid]')){ requestAnimationFrame(()=>el.querySelector('.paid').classList.add('go')); state.cart=[]; updateBadges(); }
  // thread send
  el.querySelectorAll('[data-msg-send]').forEach(b=>b.addEventListener('click',()=>{
    const inp=el.querySelector('[data-msg-input]'); if(!inp.value.trim())return; const m=document.createElement('div'); m.className='msg me'; m.textContent=inp.value; el.querySelector('.msgs').appendChild(m); inp.value=''; el.querySelector('.scroll').scrollTo(0,99999);
  }));
  // sticker buttons pop on tap
  el.querySelectorAll('.cc, [data-addcart]').forEach(b=>b.addEventListener('click',()=>pop(b)));
  // favourite toggle (heart fill)
  el.querySelectorAll('[data-fav]').forEach(b=>b.addEventListener('click',()=>{ const i=b.querySelector('i'); const on=i.classList.toggle('ph-fill'); i.classList.toggle('ph-bold',!on); if(on){i.style.color='var(--pink)';pop2(b);} else i.style.color=''; }));
  // featured carousel auto-advance (pauses on touch/hover)
  const car=el.querySelector('[data-carousel]');
  if(car){ let paused=false; car.addEventListener('pointerdown',()=>paused=true); car.addEventListener('pointerenter',()=>paused=true); car.addEventListener('pointerleave',()=>paused=false);
    const iv=setInterval(()=>{ if(paused||!document.body.contains(car)){ if(!document.body.contains(car))clearInterval(iv); return; }
      const w=car.firstElementChild?.offsetWidth+14||300; const max=car.scrollWidth-car.clientWidth-4;
      car.scrollLeft = car.scrollLeft>=max ? 0 : car.scrollLeft+w; },2600); }
  // shop tabs
  const tb=el.querySelector('[data-tabbody]');
  if(tb){ const slug=el.dataset.arg||'ekko'; renderShopTab(tb,'items',slug);
    el.querySelectorAll('[data-tab]').forEach(t=>t.addEventListener('click',()=>{ el.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x===t)); renderShopTab(tb,t.dataset.tab,slug); })); }
  // follow toggle
  el.querySelectorAll('[data-follow]').forEach(b=>b.addEventListener('click',()=>{ const on=b.classList.toggle('on'); b.textContent=on?'✓ Following':'+ Follow'; toast(on?'Following':'Unfollowed', on?'badge-bff-star':null); }));
  // review stars
  el.querySelectorAll('[data-stars] [data-star]').forEach(s=>s.addEventListener('click',()=>{ const v=+s.dataset.star; el.querySelectorAll('[data-star]').forEach(x=>x.classList.toggle('on',+x.dataset.star<=v)); }));
  // auto-open search disclosure on the search screen
  if(el.dataset.name==='search'){ const d=el.querySelector('[data-disc]'); d&&d.classList.add('open'); setTimeout(()=>el.querySelector('[data-search]')?.focus(),120); }
}
function renderShopTab(tb,tab,slug){
  const items=L.filter(l=>l.seller===slug); const list=items.length?items:L.slice(0,4);
  if(tab==='items') tb.innerHTML=`<div class="pairgrid">${list.map(pcard).join('')}</div>`;
  else if(tab==='reviews') tb.innerHTML=['Beautifully packed, exactly as described.','Fast shipping and lovely DMs.','Will buy again — top seller.'].map((t,i)=>`<div class="review" style="margin-bottom:10px"><div class="r"><span class="s val">★ ${5-(i===2?1:0)}.0</span><span class="t">${i+1}mo ago</span></div><p class="desc" style="margin-top:7px;font-size:.88rem">${t}</p></div>`).join('');
  else tb.innerHTML=`<div class="detail"><div><dt>Ships from</dt><dd>${list[0].loc}</dd></div><div><dt>Delivery</dt><dd>3–5 days</dd></div><div><dt>Returns</dt><dd>14 days</dd></div><div><dt>Payment</dt><dd>Lightning · Cashu</dd></div></div>`;
}
function renderPay(el){
  const body=el.querySelector('[data-paybody]'); if(!body)return;
  if(state.pay==='lightning'){
    body.innerHTML=`<div class="qr"><div class="mid">⚡</div></div><div class="countdown val">Invoice expires in <span data-cd>04:58</span></div><p class="muted" style="text-align:center;font-size:.84rem;margin-top:6px">Scan with any Lightning wallet. Auto-confirms on payment.</p>`;
    startCountdown(body.querySelector('[data-cd]'));
  } else {
    body.innerHTML=`<textarea class="tokenbox" placeholder="Paste your Cashu token (cashuA…)" ></textarea><p class="muted" style="font-size:.84rem;margin-top:8px">We'll redeem the token at the seller's mint and confirm instantly.</p>`;
  }
}
let cdT;
function startCountdown(node){
  clearInterval(cdT); if(!node)return; let s=298;
  cdT=setInterval(()=>{ s--; if(s<0){clearInterval(cdT);node.textContent='expired';return;} node.textContent=`0${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; },1000);
}
function updateBadges(){ document.querySelectorAll('[data-cartbadge]').forEach(b=>{ b.textContent=cartCount(); b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump'); }); }
function pop(el){ const img=el.querySelector('img'); if(!img)return; img.animate([{transform:'rotate(0) scale(1)'},{transform:'rotate(-12deg) scale(1.18)'},{transform:'rotate(0) scale(1)'}],{duration:380,easing:'cubic-bezier(.22,1,.36,1)'}); }
function pop2(el){ el.animate([{transform:'scale(1)'},{transform:'scale(1.25)'},{transform:'scale(1)'}],{duration:340,easing:'cubic-bezier(.22,1,.36,1)'}); }

// bottom nav
document.querySelectorAll('.navbtn').forEach(b=>b.addEventListener('click',()=>{ history.length=0; go(b.dataset.go); }));

// boot
go('market');
</script>
</body>
</html>
